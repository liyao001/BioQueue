[workspace]
name = "bioqueue-worker3"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.11.*"
django = "4.2.*"
numpy = "*"
scipy = "*"
psutil = "*"
python-magic = "*"
libmagic = "*"

# Nextcloud often strips +x from .pixi binaries; restore before running.
[tasks.test]
cmd = "chmod +x \"$CONDA_PREFIX/bin/python3.11\" && cd \"$PIXI_PROJECT_ROOT/..\" && \"$CONDA_PREFIX/bin/python3.11\" -m django test worker3.tests --settings=worker3.test_settings"

[tasks.smoke]
cmd = "chmod +x \"$CONDA_PREFIX/bin/python3.11\" && cd \"$PIXI_PROJECT_ROOT/..\" && \"$CONDA_PREFIX/bin/python3.11\" -m worker3.smoke"
