<div class="ui-overlay">
  <div class="ui-modal" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Archive files – job #{{ job.id }}</h3>
    <p class="text-sm opacity-70 mt-1">Queue a FileArchive tar. Use History tokens like <code>{% templatetag openvariable %}History:id-relative/path{% templatetag closevariable %}</code>, or select files in the results browser.</p>
    <form class="mt-3 space-y-3" method="post" action="{% url 'ui3:job_archive' job.id %}"
          hx-post="{% url 'ui3:job_archive' job.id %}"
          hx-target="#job-results"
          hx-swap="outerHTML"
          hx-include="#job-filters">
      {% csrf_token %}
      <label class="form-control w-full">
        <span class="label-text">Files</span>
        <textarea class="ui-input w-full" name="raw_files" rows="4" placeholder="{% templatetag openvariable %}History:{{ job.id }}-output.bam{% templatetag closevariable %}" required></textarea>
      </label>
      <label class="form-control w-full">
        <span class="label-text">Description</span>
        <input class="ui-input w-full" type="text" name="description" maxlength="500">
      </label>
      <label class="form-control w-full">
        <span class="label-text">Shared with</span>
        <input class="ui-input w-full" type="text" name="shared_with" maxlength="500" placeholder="comma-separated emails (Drive share)">
      </label>
      <div class="flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Queue archive</button>
      </div>
    </form>
  </div>
</div>
