<div class="ui-overlay">
  <div class="ui-modal ui-modal-sm" role="dialog" aria-modal="true" aria-labelledby="file-rename-title">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <div class="flex items-center gap-2 pr-8">
      <button type="button" class="ui-btn" title="Back to files"
              hx-get="{% url 'ui3:job_files' job.id %}?q={{ q|urlencode }}&sort={{ sort }}&order={{ order }}"
              hx-target="#modal-root" hx-swap="innerHTML">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h3 id="file-rename-title" class="font-bold text-lg">Rename file</h3>
    </div>
    <p class="text-sm opacity-70 mt-1 break-all">{{ name }}</p>
    {% if folder_label %}
    <p class="text-sm opacity-70">Stays in <span class="font-mono">{{ folder_label }}/</span></p>
    {% else %}
    <p class="text-sm opacity-70">The file stays in the same folder.</p>
    {% endif %}
    <form class="mt-3" method="post"
          action="{% url 'ui3:job_file_rename' job.id %}?trace={{ trace|urlencode }}&q={{ q|urlencode }}&sort={{ sort }}&order={{ order }}"
          hx-post="{% url 'ui3:job_file_rename' job.id %}?trace={{ trace|urlencode }}&q={{ q|urlencode }}&sort={{ sort }}&order={{ order }}"
          hx-target="#modal-root" hx-swap="innerHTML">
      {% csrf_token %}
      <input type="hidden" name="trace" value="{{ trace }}">
      <label class="form-control w-full">
        <span class="label-text">New name</span>
        <input class="ui-input w-full" type="text" name="new_name" value="{{ basename }}"
               maxlength="{{ max_name }}" required autocomplete="off">
      </label>
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button"
                hx-get="{% url 'ui3:job_files' job.id %}?q={{ q|urlencode }}&sort={{ sort }}&order={{ order }}"
                hx-target="#modal-root" hx-swap="innerHTML">Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Rename</button>
      </div>
    </form>
  </div>
</div>
