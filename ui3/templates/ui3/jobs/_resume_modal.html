<div class="ui-overlay">
  <div class="ui-modal ui-modal-sm" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Resume job #{{ job.id }}</h3>
    <p class="text-sm opacity-70 mt-1">Rollback to step index (0–{{ max_step }}). Current resume point: {{ current }}.</p>
    <form class="mt-3" method="post" action="{% url 'ui3:job_resume' job.id %}"
          hx-post="{% url 'ui3:job_resume' job.id %}"
          hx-target="#job-results"
          hx-swap="outerHTML"
          hx-include="#job-filters">
      {% csrf_token %}
      <label class="form-control w-full">
        <div class="label"><span class="label-text">Step index</span></div>
        <input class="ui-input w-full" type="number" name="rollback_to" min="0" max="{{ max_step }}" value="{{ current }}">
      </label>
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Resume</button>
      </div>
    </form>
  </div>
</div>
