<div class="ui-overlay">
  <div class="ui-modal ui-modal-lg ui-modal-editor" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Edit virtual environment #{{ env.id }}</h3>
    <form class="mt-3 space-y-2" method="post" action="{% url 'ui3:environment_edit' env.id %}"
          hx-post="{% url 'ui3:environment_edit' env.id %}"
          hx-target="#environment-table"
          hx-swap="outerHTML">
      {% csrf_token %}
      <input class="ui-input w-full" name="name" value="{{ env.name }}" maxlength="50" required>
      <select class="ui-select w-full" name="ve_type" aria-label="Type">
        {% for t in ve_types %}
        <option value="{{ t }}" {% if env.ve_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
      <textarea class="ui-input w-full font-mono" name="value" rows="4" required>{{ env.value }}</textarea>
      <textarea class="ui-input w-full font-mono" name="activation_command" rows="3" placeholder="Activation command (optional)">{{ env.activation_command|default:'' }}</textarea>
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn" type="button"
                hx-post="{% url 'ui3:environment_delete' env.id %}"
                hx-confirm="Delete this virtual environment?"
                hx-target="#environment-table"
                hx-swap="outerHTML">Delete</button>
        <button class="ui-btn ui-btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
