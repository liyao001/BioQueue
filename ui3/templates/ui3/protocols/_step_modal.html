<div class="ui-overlay">
  <div class="ui-modal ui-modal-sm" role="dialog" aria-modal="true" aria-labelledby="step-edit-title">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 id="step-edit-title" class="font-bold text-lg pr-8">Edit step #{{ step.step_order }}</h3>
    <form class="mt-3 space-y-3" method="post" action="{% url 'ui3:step_edit' step.id %}"
          hx-post="{% url 'ui3:step_edit' step.id %}"
          hx-target="#protocol-detail">
      {% csrf_token %}
      {{ token_list|json_script:"ui3-tokens" }}
      {% include "ui3/protocols/_step_fields.html" with software=step.software parameter=step.parameter software_required=1 selected_env=step.env %}
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
