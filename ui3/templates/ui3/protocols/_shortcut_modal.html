<div class="ui-overlay">
  <div class="ui-modal ui-modal-lg ui-modal-editor" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Edit shortcut</h3>
    <form class="mt-3 space-y-3 w-full min-w-0" method="post" action="{% url 'ui3:shortcut_edit' shortcut.id %}"
          hx-post="{% url 'ui3:shortcut_edit' shortcut.id %}"
          hx-target="#protocol-detail">
      {% csrf_token %}
      <label class="form-control">
        <div class="label"><span class="label-text">Label</span></div>
        <input class="ui-input w-full" name="label" value="{{ shortcut.label }}" required>
      </label>
      <label class="form-control">
        <div class="label"><span class="label-text">Href template</span></div>
        <textarea class="ui-input w-full font-mono" name="href_template" rows="4" required>{{ shortcut.href_template }}</textarea>
      </label>
      <label class="form-control">
        <div class="label"><span class="label-text">Params template</span></div>
        <textarea class="ui-input w-full font-mono" name="params_template" rows="4">{{ shortcut.params_template|default:'' }}</textarea>
      </label>
      <label class="form-control">
        <div class="label"><span class="label-text">Order</span></div>
        <input class="ui-input w-full" name="order" type="number" value="{{ shortcut.order }}">
      </label>
      <label class="label cursor-pointer justify-start gap-2 px-0">
        <input type="checkbox" class="checkbox checkbox-sm" name="active" value="1" {% if shortcut.active %}checked{% endif %}>
        <span class="label-text">Active</span>
      </label>
      <div class="flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
