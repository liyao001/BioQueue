<div class="ui-overlay">
  <div class="ui-modal ui-modal-lg ui-modal-editor" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Edit runner #{{ runner.id }}</h3>
    <p class="text-sm opacity-70 mt-1">Jobs assigned to {{ runner.name }} follow this record. Blank paths still inherit <span class="font-mono">config/custom.conf</span>.</p>
    <form class="mt-3" method="post" action="{% url 'ui3:runner_edit' runner.id %}"
          hx-post="{% url 'ui3:runner_edit' runner.id %}"
          hx-target="#runner-table"
          hx-swap="outerHTML">
      {% csrf_token %}
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        {% include "ui3/runners/_fields.html" %}
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn" type="button"
                hx-post="{% url 'ui3:runner_delete' runner.id %}"
                hx-confirm="Delete runner '{{ runner.name }}'?"
                hx-target="#runner-table"
                hx-swap="outerHTML">Delete</button>
        <button class="ui-btn ui-btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
