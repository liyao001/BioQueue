<div class="ui-overlay">
  <div class="ui-modal ui-modal-sm" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Rename job #{{ job.id }}</h3>
    <form class="mt-3" method="post" action="{% url 'ui3:job_rename' job.id %}"
          hx-post="{% url 'ui3:job_rename' job.id %}"
          hx-target="#job-results"
          hx-swap="outerHTML">
      {% csrf_token %}
      <label class="form-control w-full">
        <span class="label-text">New name</span>
        <input class="input input-bordered w-full" type="text" name="new_name" value="{{ job.job_name }}" required>
      </label>
      <label class="label cursor-pointer justify-start gap-2 mt-2">
        <input type="checkbox" class="checkbox checkbox-sm" name="dry_run" value="1">
        <span class="label-text">Dry run only</span>
      </label>
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Rename</button>
      </div>
    </form>
  </div>
</div>
