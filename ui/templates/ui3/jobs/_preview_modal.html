<div class="ui-overlay">
      <div class="ui-modal ui-modal-lg" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <div class="flex items-center gap-2 pr-8">
      <button type="button" class="ui-btn" title="Back to files"
              hx-get="{% url 'ui3:job_files' job.id %}?q={{ q|urlencode }}&sort={{ sort }}&order={{ order }}"
              hx-target="#modal-root" hx-swap="innerHTML">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <a class="ui-btn" title="Open in new window" href="{% url 'ui3:job_file_preview' job.id %}?trace={{ trace|urlencode }}&raw=1" target="_blank" rel="noopener">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
      <a class="ui-btn" title="Download" href="{% url 'ui3:job_file_download' job.id %}?trace={{ trace|urlencode }}" target="_blank" rel="noopener">
        <i class="fa-solid fa-download"></i>
      </a>
      <button type="button" class="ui-btn"
              title="{% if job.locked %}Locked — unlock to rename files{% else %}Rename{% endif %}"
              {% if job.locked %}disabled{% endif %}
              hx-get="{% url 'ui3:job_file_rename' job.id %}?trace={{ trace|urlencode }}&q={{ q|urlencode }}&sort={{ sort }}&order={{ order }}"
              hx-target="#modal-root" hx-swap="innerHTML">
        <i class="fa-solid fa-i-cursor"></i>
      </button>
      <h3 class="font-bold text-lg truncate">{{ name }}</h3>
    </div>
    <div class="mt-3">
      {% if mode == "text" %}
        <pre class="bg-base-200 p-3 rounded text-xs overflow-auto max-h-[60vh] whitespace-pre-wrap">{{ text }}</pre>
      {% elif mode == "img" %}
        <img src="{% url 'ui3:job_file_preview' job.id %}?trace={{ trace|urlencode }}&raw=1" alt="{{ name }}" class="max-w-full max-h-[60vh] mx-auto">
      {% elif mode == "download" %}
        <div class="p-6 text-center text-sm opacity-80">
          <p>This file type cannot be previewed in the browser.</p>
          <a class="ui-btn ui-btn-primary mt-4 inline-flex" href="{% url 'ui3:job_file_download' job.id %}?trace={{ trace|urlencode }}" target="_blank" rel="noopener">
            <i class="fa-solid fa-download"></i> Download
          </a>
        </div>
      {% else %}
        <iframe src="{% url 'ui3:job_file_preview' job.id %}?trace={{ trace|urlencode }}&raw=1" class="w-full" style="height: 60vh; border: 1px solid #e5e7eb; border-radius: 0.375rem;"></iframe>
      {% endif %}
    </div>
  </div>
</div>
