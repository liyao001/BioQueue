<div class="ui-overlay">
  <div class="ui-modal ui-modal-lg" role="dialog" aria-modal="true" aria-labelledby="files-title">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 id="files-title" class="font-bold text-lg pr-8">Results – job #{{ job.id }} {{ job.job_name }}</h3>
    <p class="text-sm opacity-70 mt-1">{{ job.result|default:"(no result folder)" }}</p>
    {% include "ui3/jobs/_files_table.html" %}
    {% if job.ui3_can_write %}
    <form id="job-archive-form-{{ job.id }}" class="mt-3 flex justify-end"
          hx-post="{% url 'ui3:job_archive' job.id %}"
          hx-target="#toast-root"
          hx-swap="innerHTML">
      {% csrf_token %}
      <button class="ui-btn ui-btn-primary" type="submit">Queue selected for archive</button>
    </form>
    {% endif %}
  </div>
</div>
