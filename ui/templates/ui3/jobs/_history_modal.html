<div class="ui-overlay">
  <div class="ui-modal" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">History – job #{{ job.id }}</h3>
    <div class="mt-3 overflow-auto max-h-96">
      {% if items %}
      <table class="table table-zebra table-sm w-full">
        <thead>
          <tr>
            <th>Operation</th>
            <th>Time</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody>
          {% for item in items %}
          <tr>
            <td>{{ item.operation }}</td>
            <td class="whitespace-nowrap">{{ item.create_time }}</td>
            <td class="text-xs">{{ item.comments|default:"" }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="text-sm opacity-70">No history recorded.</p>
      {% endif %}
    </div>
    <div class="mt-3 flex justify-end">
      <button class="ui-btn" type="button" data-ui3-close>Close</button>
    </div>
  </div>
</div>
