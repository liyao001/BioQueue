<div class="ui-overlay">
  <div class="ui-modal ui-modal-sm" role="dialog" aria-modal="true">
    <button type="button" class="ui-modal-x" data-ui3-close aria-label="Close">&times;</button>
    <h3 class="font-bold text-lg pr-8">Compare job #{{ job.id }}</h3>
    <p class="text-sm opacity-70 mt-1">Enter another job id to diff parameters and input files.</p>
    <form class="mt-3" method="get" action="{% url 'ui3:job_compare' job.id %}">
      <label class="form-control w-full">
        <span class="label-text">Other job id</span>
        <input class="ui-input w-full" type="number" name="other" min="1" required autofocus>
      </label>
      <div class="mt-3 flex justify-end gap-2">
        <button class="ui-btn" type="button" data-ui3-close>Cancel</button>
        <button class="ui-btn ui-btn-primary" type="submit">Compare</button>
      </div>
    </form>
  </div>
</div>
